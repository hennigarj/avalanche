<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Avalanche</title>
<!-- KEEP your existing manifest link here if you already added one:

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Kit</h1>

<div id="grid"></div>

<div class="transport">
  <button id="toggle">Start</button>
  <button id="metro">Click off</button>
</div>

<label>Tempo — <span id="bpmLabel">120</span> BPM</label>
<input type="range" id="bpm" min="40" max="200" value="120">

<div id="diag">
  <div><span>Audio context</span><b id="dState">—</b></div>
  <div><span>Worst margin</span><b id="dMargin">—</b></div>
  <div><span>Running for</span><b id="dTime">—</b></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
