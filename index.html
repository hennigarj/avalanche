<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The page itself must never zoom (DESIGN.md 3.7): only the app zooms,
     by its own gestures. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Avalanche</title>
<!-- KEEP your existing manifest link here if you already added one:
<link rel="manifest" href="manifest.json"> -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- TEMPORARY — a stand-in for song view (milestone 9). -->
<div id="tracks" class="tracks"></div>

<div id="grid"></div>

<div class="transport">
  <button id="shift">Shift</button>
  <button id="back">Back</button>
  <button id="toggle">Start</button>
  <button id="metro">Click off</button>
</div>

<!-- TEMPORARY — placeholder instrument controls. The rulers and knobs
     replace them in milestone 7. Only shown for instrument tracks. -->
<div id="instControls" class="controls" hidden>
  <div class="row">
    <button id="rowsDown">▼</button>
    <button id="rowsUp">▲</button>
    <button id="scale">Scale</button>
    <span id="keyName" class="readout"></span>
    <button id="mode">Mode</button>
    <span class="gap"></span>
    <button id="octDown">Oct −</button>
    <button id="octUp">Oct +</button>
    <button id="semiDown">Semi −</button>
    <button id="semiUp">Semi +</button>
  </div>
  <div class="knobs">
    <div class="knob"><span>Attack <b id="attackVal"></b></span><input type="range" id="attack" min="0" max="1000"></div>
    <div class="knob"><span>Release <b id="releaseVal"></b></span><input type="range" id="release" min="0" max="1000"></div>
    <div class="knob"><span>Cutoff <b id="cutoffVal"></b></span><input type="range" id="cutoff" min="0" max="1000"></div>
    <div class="knob"><span>Resonance <b id="resonanceVal"></b></span><input type="range" id="resonance" min="0" max="1000"></div>
  </div>
</div>

<label>Tempo — <span id="bpmLabel">120</span> BPM</label>
<input type="range" id="bpm" min="40" max="200" value="120">

<!-- The sample's own pitch. Rarely needed, so kept down here. -->
<div id="sampleRoot" class="minor" hidden>
  <span>Sample root</span>
  <button id="rootDown">−</button>
  <b id="rootName">C3</b>
  <button id="rootUp">+</button>
</div>

<div id="diag">
  <div><span>Audio context</span><b id="dState">—</b></div>
  <div><span>Worst margin</span><b id="dMargin">—</b></div>
  <div><span>Running for</span><b id="dTime">—</b></div>
  <div><span>Storage</span><b id="dStorage">—</b></div>
  <div><span>Last save</span><b id="dSaved">—</b></div>
  <div id="dErrorRow" hidden><span>Error</span><b id="dError" class="bad"></b></div>
</div>

<script>
  // Stop Safari zooming the page. Safari pinch-zooms through its own
  // 'gesture' events and doesn't always honour user-scalable=no, so
  // cancel them outright. Pads and buttons run on pointer events, which
  // this doesn't touch. A plain script, so it works even if a module
  // fails to load.
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
</script>
<script>
  // There's no console on the iPad, so show the latest uncaught error on
  // screen. A plain script (not a module) so it still runs if a module
  // fails to load.
  (function () {
    function show(message) {
      var row = document.getElementById('dErrorRow');
      document.getElementById('dError').textContent = message;
      row.hidden = false;
    }
    window.addEventListener('error', function (e) { show(e.message || 'Error'); });
    window.addEventListener('unhandledrejection', function (e) { show(String(e.reason)); });
  })();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
